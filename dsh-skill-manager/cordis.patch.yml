# dsh-skill-manager bundle patch.
#
# One Host row. The loader id below, the `id` in dsh.plugin.json, and the
# plugin's exported `name` are the same identifier: `skill-manager`.
#
# The row also carries the browser half: the package manifest declares
# `dsh.client`, so the client module (id = package name) is served and loaded
# into the page independently of this Host row.
- insert:
    - id: skill-manager
      name: 'dsh-skill-manager'
